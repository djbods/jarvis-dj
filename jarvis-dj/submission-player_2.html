<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submission Player — v3</title>
<style>
  :root {
    --bg-1: #3a2d5c; --bg-2: #6a4a7a; --bg-3: #c98ba0; --bg-glow: rgba(255,170,200,0.35);
    --tile-glass: rgba(220,222,230,0.13);
    --panel-glass: rgba(52,52,62,0.58);
    --glass-border: rgba(255,255,255,0.28);
    --glass-hi: rgba(255,255,255,0.5);
    --wave-past: rgba(20,18,28,0.9);
    --wave-future: rgba(255,255,255,0.95);
    --needle: #ffd36b;
    --text: #fff; --muted: rgba(255,255,255,0.62); --ink: #2a2436;
    --orange: #ff7a2f; --green: #47d16a; --yellow: #ffcf47;
    --silver: linear-gradient(180deg,#e8e8ef,#b9b9c8);
    --t-fast: 0.15s ease;
    --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font); color: var(--text); display: grid; place-items: center; min-height: 100vh;
    background:
      radial-gradient(120% 90% at 80% -10%, var(--bg-glow), transparent 55%),
      linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 130%);
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0 5px, rgba(0,0,0,0.03) 5px 6px);
    pointer-events: none;
  }
  body.drag-over::after {
    content: "drop audio files to queue"; position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(20,10,40,0.55); font-size: 24px; letter-spacing: 2px; z-index: 999; pointer-events: none;
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900; }
  .toolbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(30,24,44,0.6);
    border: 1px solid var(--glass-border); border-radius: 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 13px;
  }
  .toolbar button, .toolbar label {
    font-family: var(--font); font-size: 13px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.1);
    color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: background var(--t-fast), transform var(--t-fast);
  }
  .toolbar button:hover, .toolbar label:hover { background: rgba(255,255,255,0.2); }
  .toolbar button:active { transform: scale(0.97); }
  .toolbar .toggle.on { background: var(--orange); border-color: var(--orange); }
  .toolbar .readout { color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  #fileInput { display: none; }
  /* reserve a fixed side gutter (not a %) so the LUFS meter, which sits ~46px past the
     wave's right edge, always has room on tablet / small-desktop viewports */
  .stage { width: min(1000px, calc(100vw - 160px)); perspective: 1300px; padding: 40px 10px; transition: width 0.34s cubic-bezier(0.4,0,0.2,1); }
  .overlay {
    position: relative; transform-style: preserve-3d;
    /* fixed perspective tilt — the panel sits at a static angle (no mouse parallax).
       a slow "ocean roll" (--rock, written only while playing) layers on top. origin
       sits low near the transport so controls barely move while the top sways. */
    --tilt-x: 8deg; --tilt-z: -1.4deg;
    transform-origin: 50% 82%;
    transform:
      rotateX(var(--tilt-x))
      rotateZ(calc(var(--tilt-z) + var(--rock, 0) * 1deg))
      rotateY(calc(var(--rock, 0) * 0.5deg));
    will-change: transform;
  }
  .overlay.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%,100% { translate: 0 0; } 15% { translate: -8px 4px; } 30% { translate: 7px -5px; }
    45% { translate: -6px -3px; } 60% { translate: 5px 4px; } 75% { translate: -3px 2px; }
  }
  .layer {
    transform: translate3d(calc(var(--px,0)*var(--drift,0)*1px), calc(var(--py,0)*var(--drift,0)*1px), var(--depth,0px));
    transition: transform 0.12s ease-out; will-change: transform;
  }
  .meter { --depth: 6px; --drift: 10; margin-bottom: 6px; }
  .meter .row {
    display: flex; align-items: center; justify-content: space-between; font-variant-numeric: tabular-nums;
    font-size: 12px; letter-spacing: 0.5px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .meter .read { color: #cfe; display: flex; gap: 10px; }
  .meter .read span { color: rgba(255,255,255,0.55); }
  .wave-wrap { --depth: 20px; --drift: 14; position: relative; margin-top: 92px; }
  /* gray plate the waveform sits on (screenshot look): dark played bars + white upcoming
     bars read against a neutral gray field. Painted behind .rolling / .overview-wrap. */
  .wave-plate {
    position: absolute; left: -18px; right: -18px; top: -18px; bottom: -6px; z-index: 0;
    background: linear-gradient(180deg, rgba(128,130,142,0.60), rgba(104,106,118,0.55));
    border: 1px solid rgba(255,255,255,0.16); border-radius: 22px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 18px 40px rgba(20,10,40,0.30);
  }
  .rolling {
    position: relative; height: 280px; cursor: grab;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .rolling.grabbing { cursor: grabbing; }
  #rolling { width: 100%; height: 100%; display: block; touch-action: none; }
  .transition-marker {
    position: absolute; top: 4%; bottom: 4%; width: 3px; background: rgba(255,80,80,0.8);
    box-shadow: 0 0 10px 2px rgba(255,80,80,0.6); pointer-events: none; z-index: 3;
  }
  .last-beat-marker {
    position: absolute; top: 4%; bottom: 4%; width: 2px; background: rgba(255,200,50,0.6);
    box-shadow: 0 0 8px 1px rgba(255,200,50,0.4); pointer-events: none; z-index: 2;
  }
  .beat-counter {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,0.7);
    pointer-events: none; z-index: 4;
  }
  .beat-counter .current-beat {
    color: var(--needle); font-size: 14px;
  }
  .wave-glow {
    position: absolute; inset: -20px; border-radius: 24px; pointer-events: none; opacity: 0;
    background: radial-gradient(60% 80% at 50% 50%, var(--glow, #fff), transparent 70%); z-index: 1; transition: opacity 0.1s linear;
  }
  .swipe-ghost { position: absolute; inset: 0; z-index: 2; pointer-events: none; animation: swipeLeft 0.55s cubic-bezier(0.4,0,0.2,1) forwards; }
  @keyframes swipeLeft { from { transform: translateX(0); opacity: 0.95; } to { transform: translateX(-115%); opacity: 0; } }
  .tstamp {
    position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.85); text-shadow: 0 1px 4px rgba(0,0,0,0.6); pointer-events: none; z-index: 3;
  }
  .tstamp.start { left: 10px; } .tstamp.end { right: 10px; }
  .tstamp.now { left: 50%; top: -22px; transform: translateX(-50%); color: var(--needle); font-weight: 700; font-size: 14px; }
  /* live LUFS meter — CDJ-style discrete LED ladder (momentary, K-weighted) */
  .lufs {
    position: absolute; top: 0; right: -46px; height: 280px; width: 34px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .lufs .lufs-label { font-size: 9px; letter-spacing: 1.5px; color: rgba(255,255,255,0.55); }
  .lufs .lufs-track {
    flex: 1; width: 26px; display: flex; flex-direction: column-reverse; gap: 2px;
    padding: 4px; border-radius: 6px; background: rgba(6,5,14,0.55);
    border: 1px solid var(--glass-border); box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .lufs .lufs-tile {
    flex: 1; border-radius: 2px; background: var(--off);
    transition: background-color 0.04s linear, box-shadow 0.04s linear;
  }
  .lufs .lufs-tile.green { --on: #35e06a; --off: rgba(53,224,106,0.12); }
  .lufs .lufs-tile.amber { --on: #ffce3a; --off: rgba(255,206,58,0.12); }
  .lufs .lufs-tile.red   { --on: #ff4646; --off: rgba(255,70,70,0.12); }
  .lufs .lufs-tile.on {
    background: var(--on);
    box-shadow: 0 0 6px var(--on), inset 0 0 2px rgba(255,255,255,0.55);
  }
  .lufs .lufs-tile.peak {
    background: var(--on);
    box-shadow: 0 0 9px var(--on), inset 0 0 3px rgba(255,255,255,0.85);
    outline: 1px solid rgba(255,255,255,0.85);
  }
  .lufs .lufs-value { font-size: 11px; font-variant-numeric: tabular-nums; color: #dfe7ff; font-weight: 600; }
  /* full-track overview — now tight below the rolling waveform, and scrubbable */
  .overview-wrap { position: relative; height: 54px; margin-top: 6px; cursor: pointer; }
  #overview { width: 100%; height: 100%; display: block; touch-action: none; }
  .overview-marker {
    position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--needle);
    box-shadow: 0 0 6px rgba(255,211,107,0.8); left: 0; pointer-events: none;
  }
  .overview-hair { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.35); left: 0; pointer-events: none; opacity: 0; }
  .sub-card {
    --depth: 60px; --drift: 26; position: absolute; top: 118px; left: 50%; margin-left: -185px; width: 370px; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--tile-glass);
    border: 1px solid var(--glass-border); border-radius: 16px; backdrop-filter: blur(10px) saturate(1.15); -webkit-backdrop-filter: blur(10px) saturate(1.15);
    box-shadow: 0 18px 40px rgba(20,10,40,0.35), inset 0 1px 0 var(--glass-hi);
  }
  .big-emoji-burst {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; z-index: 1000;
    pointer-events: none; animation: burstPulse 0.8s ease-out forwards; text-shadow: 0 0 60px rgba(255,255,255,0.8);
  }
  @keyframes burstPulse {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
  }
  .sub-card .avatar {
    width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfcfe0, #6d6d84); border: 1px solid rgba(255,255,255,0.5);
    display: grid; place-items: center; color: rgba(255,255,255,0.9); font-size: 18px;
  }
  /* embedded cover art fills the round avatar; object-fit:cover crops to the circle so
     non-square artwork is never stretched */
  .sub-card .avatar.has-thumb { background: none; }
  .sub-card .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .sub-card .meta { flex: 1 1 auto; min-width: 0; }
  .sub-card .name {
    font-weight: 800; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4); white-space: nowrap; overflow: hidden;
  }
  /* inner span carries the text so it can slide when the name overflows the card;
     the ping-pong keyframe reveals the tail then returns, spotify-style */
  .sub-card .name .marquee-inner { display: inline-block; white-space: nowrap; }
  .sub-card .name.is-scrolling .marquee-inner {
    animation: track-marquee var(--marquee-duration, 8s) ease-in-out infinite;
  }
  @keyframes track-marquee {
    0%, 14%   { transform: translateX(0); }
    46%, 54%  { transform: translateX(var(--marquee-shift, 0)); }
    86%, 100% { transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sub-card .name.is-scrolling .marquee-inner { animation: none; }
    .sub-card .name { text-overflow: ellipsis; }
  }
  .sub-card .elo-line { font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,0.78); }
  .sub-card .tier {
    position: absolute; bottom: 8px; right: 14px; font-size: 10px; font-weight: 800; letter-spacing: 2px;
    background: var(--silver); color: #4a4a5a; padding: 2px 7px; border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .sub-card .pips {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 8px; background: rgba(60,50,80,0.4);
    border: 1px solid rgba(255,255,255,0.25); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px; align-self: flex-start;
  }
  .sub-card .pips b { background: #bfa4ff; border-radius: 50%; box-shadow: 0 0 6px rgba(191,164,255,0.8); }
  .transport {
    --depth: 42px; --drift: 18; position: relative; z-index: 4; margin: 16px auto 0; width: max-content;
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--panel-glass);
    border: 1px solid var(--glass-border); border-radius: 20px; backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1);
    box-shadow: 0 16px 34px rgba(20,10,40,0.5), inset 0 1px 0 var(--glass-hi);
  }
  .tbtn { border: none; cursor: pointer; display: grid; place-items: center; color: #fff; font-family: var(--font); transition: transform var(--t-fast), background var(--t-fast), filter var(--t-fast); }
  .tbtn:active { transform: scale(0.94); }
  .tbtn.chip { width: 34px; height: 34px; border-radius: 9px; font-size: 16px; background: rgba(255,255,255,0.16); }
  .tbtn.chip.green { background: var(--green); }
  .tbtn.chip:hover { filter: brightness(1.12); }
  .tbtn.round { width: 34px; height: 34px; border-radius: 50%; background: transparent; }
  .tbtn.round:hover { background: rgba(255,255,255,0.18); }
  .tbtn.round svg { width: 20px; height: 20px; fill: #fff; }
  .tbtn.play { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.95); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
  .tbtn.play svg { width: 22px; height: 22px; fill: var(--ink); }
  .tbtn.stop { width: 34px; height: 34px; border-radius: 9px; background: var(--orange); box-shadow: 0 4px 12px rgba(255,122,47,0.45); }
  .tbtn.stop::after { content: ""; width: 12px; height: 12px; background: #fff; border-radius: 2px; }
  .tbtn.flame { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,122,47,0.22); font-size: 17px; }
  .tbtn[data-react].editing { outline: 2px dashed var(--yellow); outline-offset: 2px; cursor: text; animation: editPulse 1.1s ease-in-out infinite; }
  @keyframes editPulse { 0%,100% { outline-color: var(--yellow); } 50% { outline-color: rgba(255,207,71,0.35); } }
  .counter { --depth: 30px; --drift: 12; text-align: center; margin-top: 14px; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.85); text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.5); text-align: center; }
  .emoji-modal { position: fixed; inset: 0; z-index: 1100; display: grid; place-items: center; }
  .emoji-modal[hidden] { display: none; }
  .emoji-modal-backdrop { position: absolute; inset: 0; background: rgba(12,8,24,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .emoji-modal-panel {
    position: relative; width: min(460px, 92vw); max-height: 70vh; display: flex; flex-direction: column;
    background: rgba(34,28,50,0.92); border: 1px solid var(--glass-border); border-radius: 18px;
    box-shadow: 0 30px 70px rgba(10,4,30,0.6), inset 0 1px 0 var(--glass-hi);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); overflow: hidden;
  }
  .emoji-modal-head {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .emoji-modal-close {
    border: none; background: rgba(255,255,255,0.1); color: #fff; width: 28px; height: 28px; border-radius: 8px;
    cursor: pointer; font-size: 14px; line-height: 1; transition: background var(--t-fast);
  }
  .emoji-modal-close:hover { background: rgba(255,255,255,0.22); }
  .emoji-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px;
    padding: 14px; overflow-y: auto;
  }
  .emoji-choice {
    border: none; background: transparent; cursor: pointer; font-size: 24px; line-height: 1;
    aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; transition: background var(--t-fast), transform var(--t-fast);
  }
  .emoji-choice:hover { background: rgba(255,255,255,0.16); transform: scale(1.15); }
  /* when the queue is open, slide the whole stage right so the panel never covers the
     player — the grid still centres the stage within the padded area. */
  body { transition: padding-left 0.34s cubic-bezier(0.4,0,0.2,1); }
  body.queue-open { padding-left: 280px; }
  /* shrink the stage by the panel's footprint too, so the player's right edge (LUFS
     meter + controls) is never clipped on narrower windows — it just scales down. */
  body.queue-open .stage { width: min(1000px, calc(100vw - 160px - 280px)); }
  /* queue panel — slide-in track list on the left gutter */
  .queue-panel {
    position: fixed; top: 64px; left: 14px; bottom: 14px; width: 252px; z-index: 40;
    display: flex; flex-direction: column; overflow: hidden;
    background: rgba(30,24,44,0.62); border: 1px solid var(--glass-border); border-radius: 14px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px rgba(20,10,40,0.4), inset 0 1px 0 var(--glass-hi);
    transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none;
    transition: transform 0.32s cubic-bezier(0.4,0,0.2,1), opacity 0.32s;
  }
  .queue-panel.open { transform: none; opacity: 1; pointer-events: auto; }
  .queue-head {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .queue-head .qhead-right { display: flex; align-items: center; gap: 8px; }
  .queue-head .qcount { color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }
  .queue-close {
    border: none; background: rgba(255,255,255,0.1); color: #fff; width: 24px; height: 24px; border-radius: 7px;
    cursor: pointer; font-size: 12px; line-height: 1; transition: background var(--t-fast);
  }
  .queue-close:hover { background: var(--orange); }
  .queue-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .queue-empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .queue-row {
    display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid transparent; cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast);
  }
  .queue-row:hover { background: rgba(255,255,255,0.1); }
  .queue-row.active { border-color: var(--orange); background: rgba(255,122,47,0.16); }
  .queue-row.dragging { opacity: 0.4; }
  .queue-row.drop-before { box-shadow: inset 0 3px 0 var(--orange); }
  .queue-row.drop-after { box-shadow: inset 0 -3px 0 var(--orange); }
  .queue-row .qidx {
    width: 16px; flex: 0 0 auto; text-align: center; font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .queue-row.active .qidx { color: var(--orange); }
  .queue-row .qthumb {
    width: 30px; height: 30px; flex: 0 0 auto; border-radius: 7px; overflow: hidden; display: grid; place-items: center;
    font-size: 14px; color: rgba(255,255,255,0.85);
    background: radial-gradient(circle at 35% 30%, #cfcfe0, #6d6d84); border: 1px solid rgba(255,255,255,0.35);
  }
  .queue-row .qthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .queue-row .qmeta { flex: 1 1 auto; min-width: 0; }
  .queue-row .qname { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-row .qbpm { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
  .queue-row .qremove {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: none; cursor: pointer;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-size: 12px; line-height: 1;
    opacity: 0; transition: opacity var(--t-fast), background var(--t-fast), color var(--t-fast);
  }
  .queue-row:hover .qremove, .queue-row.active .qremove { opacity: 1; }
  .queue-row .qremove:hover { background: var(--orange); color: #fff; }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="toolbar">
    <label for="fileInput">＋ Load tracks</label>
    <input id="fileInput" type="file" accept="audio/*" multiple />
    <button class="toggle" id="queueToggle" title="show / hide the track queue (Q)">Queue</button>
    <button class="toggle" id="bpmToggle">BPM cue: off</button>

function pressReaction(key, btn) {
  tally[key] = (tally[key] || 0) + 1;
  hype = Math.min(1, hype + 0.16);
  hypeRGB = REACTIONS[key].rgb.slice(); hypeEmoji = REACTIONS[key].emoji;
  fillRGB = REACTIONS[key].rgb.slice(); fillStart = performance.now();   // solid-fill the played bars
  rainFromBehind(key);                                                   // emoji flood over the front
}

/* ---------- ui sync ---------- */
const PLAY_PATH = "M8 5v14l11-7z", PAUSE_PATH = "M6 5h4v14H6zm8 0h4v14h-4z";
function syncPlayIcon() { $("playIcon").setAttribute("d", state === "playing" ? PAUSE_PATH : PLAY_PATH); }
/* drop the full name into the sliding inner span, then measure whether it
   overflows the card. only tracks wider than their container get animated, and
   the scroll duration scales with the overflow so speed stays constant. */
function setTrackName(name) {
  const box = $("trackName");
  let inner = box.querySelector(".marquee-inner");
  if (!inner) { inner = document.createElement("span"); inner.className = "marquee-inner"; box.appendChild(inner); }
  inner.textContent = name;
  box.classList.remove("is-scrolling");
  box.style.removeProperty("--marquee-shift");
  box.style.removeProperty("--marquee-duration");
  requestAnimationFrame(() => {
    const overflow = inner.scrollWidth - box.clientWidth;
    if (overflow > 4) {
      box.style.setProperty("--marquee-shift", (-overflow) + "px");
      box.style.setProperty("--marquee-duration", Math.max(6, overflow / 22 + 4).toFixed(1) + "s");
      box.classList.add("is-scrolling");
    }
  });
}
function updateCard() {
  highlightActiveRow();
  const track = queue[currentIndex];
  if (!track) { $("readout").textContent = "no tracks loaded"; return; }
  setTrackName(track.name);
  const av = $("trackAvatar");
  if (track.thumb) {
    if (av.dataset.thumb !== track.thumb) { av.innerHTML = '<img alt="cover" src="' + track.thumb + '">'; av.dataset.thumb = track.thumb; av.classList.add("has-thumb"); }
  } else if (av.dataset.thumb) { av.textContent = "♫"; av.removeAttribute("data-thumb"); av.classList.remove("has-thumb"); }
  $("subN").textContent = currentIndex + 1;
  const cue = cueOffset(currentIndex);
  const trans = transitionPoint(currentIndex);

  // Show DJ mode info
  let modeInfo = "";
  if (bpmMode) {
    modeInfo = " (DJ)";
    if (track.lastBeatPoint !== null) {
      modeInfo += ` <span style="color:var(--green)">✓ end ${fmt(track.lastBeatPoint)}</span>`;
    }
    if (track.phraseStart !== null) {
      modeInfo += ` <span style="color:var(--yellow)">♪ start ${fmt(track.phraseStart)}</span>`;
    }
    if (scheduledNext && scheduledNext.transitionTime) {
      const currentPos = positionNow();
      const beatsRemaining = Math.round((scheduledNext.transitionTime - currentPos) / (60 / (track.bpm || 120)));
      if (beatsRemaining > 0 && beatsRemaining <= 16) {
        modeInfo += ` <span style="color:var(--orange)">↓ ${beatsRemaining} beats</span>`;
      }
    }
  }

  $("analysisRead").innerHTML = "BPM " + (track.bpm || "—") + " <span>|</span> onset " + fmt(track.onsetCue) + " <span>|</span> cue " + fmt(cue) + modeInfo;
  $("readout").textContent = queue.length + " track" + (queue.length > 1 ? "s" : "") + " · #" + (currentIndex + 1);
}

/* ---------- main loop ---------- */
let lastT = performance.now() / 1000;
function loop() {
  const now = performance.now() / 1000; let dt = now - lastT; lastT = now; if (dt > 0.05) dt = 0.05;
  // hype decays
  if (hype > 0) { hype = Math.max(0, hype - dt * 0.6); if (hype < 0.02) hypeRGB = [255,255,255]; }
  // Commit a scheduled transition the instant we reach it. Loop-driven (not a timer)
  // so it stays in lock-step with the audio clock and can't fire after a teardown.
  if (state === "playing" && ctx && scheduledNext && ctx.currentTime >= scheduledNext.startTime) commitTransition();
  if (_stageResizing) resizeCanvases();
  drawFrame();
  updateLufs();
  updateRock(now);
  stepParticles(dt); drawParticles();
  requestAnimationFrame(loop);
}

/* ---------- wiring ---------- */
$("play").onclick = () => play();
$("stop").onclick = () => stopAll();
$("prev").onclick = () => prevTrack();
$("next").onclick = () => nextTrack();
$("reset").onclick = () => resetQueue();
$("bpmToggle").onclick = () => {
  bpmMode = !bpmMode; $("bpmToggle").textContent = "BPM cue: " + (bpmMode ? "on" : "off"); $("bpmToggle").classList.toggle("on", bpmMode);
  if (scheduledNext) scheduleFollowing(); updateCard();
};
document.querySelectorAll("[data-react]").forEach(btn => {
  btn.addEventListener("click", () => {
    if (editMode) openEmojiPicker(btn.dataset.react);
    else pressReaction(btn.dataset.react, btn);
  });
});
// Edit mode: click a reaction chip to open the emoji picker; picking one swaps that reaction
// (and every chip sharing its key). Grid is built lazily on first open.
const EMOJI_CHOICES = ("😀 😃 😄 😁 😆 😅 🤣 😂 🙂 😉 😊 😍 🥰 😘 😎 🤩 🥳 😏 😌 😴 " +
  "🤯 😳 🥵 🥶 😱 🤬 😤 👿 💀 👻 👽 🤖 💩 🔥 ✨ 💥 ⚡ 🌟 💫 ⭐ " +
  "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💔 💖 💯 ✅ ❌ ⚠️ 🚀 🎉 🎊 🎈 🎁 🏆 " +
  "👏 🙌 👍 👎 👌 🤟 🤘 ✊ 👊 🤝 🙏 💪 🫶 👋 🤙 ✌️ 🫰 🖐️ 🤞 👀 " +
  "🎵 🎶 🎧 🎤 🎸 🎹 🥁 🎺 🔊 📢 🌈 💧 🌊 🍾 🥂 🍻 🕺 💃 🐐 😈").split(/\s+/);
let editingKey = null;
function openEmojiPicker(key) {
  if (!REACTIONS[key]) return;
  editingKey = key;
  const grid = $("emojiGrid");
  if (!grid.childElementCount) {
    EMOJI_CHOICES.forEach(e => {
      const b = document.createElement("button");
      b.className = "emoji-choice"; b.type = "button"; b.textContent = e;
      b.addEventListener("click", () => { applyReactionEmoji(editingKey, e); closeEmojiPicker(); });
      grid.appendChild(b);
    });
  }
  $("emojiModal").hidden = false;
}
function closeEmojiPicker() { $("emojiModal").hidden = true; editingKey = null; }
// Sample a representative colour for the emoji so the waveform fill + particle tint follow
// the chosen emoji. Vivid (saturated) pixels are weighted higher so a mostly-red emoji reads
// red, not a muddy grey average. IMPORTANT: this rasterises into a throwaway canvas, NOT the
// cached render sprite — calling getImageData on the sprite would force it off the GPU and
// make every per-frame drawImage of it re-upload (that was the post-change burst choppiness).
function emojiAverageRGB(emoji) {
  const px = 44;
  const c = document.createElement("canvas");
  c.width = c.height = px;
  const cc = c.getContext("2d", { willReadFrequently: true });
  cc.font = Math.round(px * 0.8) + "px sans-serif";
  cc.textAlign = "center"; cc.textBaseline = "middle";
  cc.fillText(emoji, px / 2, px / 2);
  let data;
  try { data = cc.getImageData(0, 0, px, px).data; }
  catch (err) { return null; }
  let r = 0, g = 0, b = 0, wsum = 0;
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3]; if (a < 40) continue;
    const R = data[i], G = data[i + 1], B = data[i + 2];
    const sat = Math.max(R, G, B) - Math.min(R, G, B);
    const w = (a / 255) * (0.2 + sat / 255);
    r += R * w; g += G * w; b += B * w; wsum += w;
  }
  if (wsum <= 0) return null;
  return [Math.round(r / wsum), Math.round(g / wsum), Math.round(b / wsum)];
}
function applyReactionEmoji(key, e) {
  if (!REACTIONS[key] || !e) return;
  REACTIONS[key].emoji = e;
  const rgb = emojiAverageRGB(e);
  if (rgb) { REACTIONS[key].rgb = rgb; REACTIONS[key].colour = "rgb(" + rgb.join(",") + ")"; }
  emojiSprite(e);   // pre-warm the render sprite so the first burst frame doesn't build it
  document.querySelectorAll('[data-react="' + key + '"]').forEach(b => { b.textContent = e; });
}
$("emojiModalClose").onclick = closeEmojiPicker;
$("emojiModalBackdrop").onclick = closeEmojiPicker;
window.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("emojiModal").hidden) closeEmojiPicker(); });
$("emojiEdit").onclick = () => {
  editMode = !editMode;
  $("emojiEdit").classList.toggle("on", editMode);
  $("emojiEdit").textContent = editMode ? "done editing" : "edit emojis";
  document.querySelectorAll("[data-react]").forEach(b => b.classList.toggle("editing", editMode));
  $("readout").textContent = editMode ? "click a reaction to change its emoji" : (queue.length ? queue.length + " track" + (queue.length > 1 ? "s" : "") + " · #" + (currentIndex + 1) : "no tracks loaded");
};
$("fileInput").addEventListener("change", (e) => loadFiles(e.target.files));
document.body.addEventListener("dragover", (e) => { if (dragFromIdx !== null) return; e.preventDefault(); document.body.classList.add("drag-over"); });
document.body.addEventListener("dragleave", (e) => { if (e.target === document.body) document.body.classList.remove("drag-over"); });
document.body.addEventListener("drop", (e) => { e.preventDefault(); document.body.classList.remove("drag-over"); if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

/* ---------- scrub: rolling waveform (relative drag) ---------- */
let lastScrub = 0;
let rollDragX = 0, rollDragPos = 0, rollWasPlaying = false;
rollWrap.addEventListener("pointerdown", (e) => {
  if (!queue.length) return;
  dragging = true; rollWrap.classList.add("grabbing"); rollWrap.setPointerCapture(e.pointerId);
  rollDragX = e.clientX; rollDragPos = positionNow(); rollWasPlaying = state === "playing";
  if (rollWasPlaying) { anchorPos = positionNow(); stopActiveAndScheduled(); }
});
rollWrap.addEventListener("pointermove", (e) => {
  if (!dragging || rollDragX === 0) return;
  const pps = rollSize.w / WINDOW_SECONDS; const dt = (e.clientX - rollDragX) / pps;
  let pos = rollDragPos - dt; const dur = queue[currentIndex].buffer.duration; pos = Math.max(0, Math.min(dur - 0.01, pos)); anchorPos = pos;
  if (rollWasPlaying) { const now = performance.now(); if (now - lastScrub > 90) { lastScrub = now; seekTo(pos, true); anchorPos = pos; } }
});
function endRollDrag() {
  if (rollDragX === 0) return; const pos = anchorPos; rollDragX = 0; dragging = false; rollWrap.classList.remove("grabbing");
  if (rollWasPlaying) startTrack(currentIndex, ctx.currentTime + 0.01, pos, true); else drawFrame();
}
rollWrap.addEventListener("pointerup", endRollDrag);
rollWrap.addEventListener("pointercancel", endRollDrag);

/* ---------- scrub: overview waveform (absolute seek: click/drag anywhere) ---------- */
let ovActive = false, ovWasPlaying = false;
function ovPosFromX(clientX) {
  const r = overCanvas.getBoundingClientRect(); let frac = (clientX - r.left) / r.width; frac = Math.max(0, Math.min(1, frac));
  return frac * queue[currentIndex].buffer.duration;
}
overWrap.addEventListener("pointerdown", (e) => {
  if (!queue.length) return;
  ovActive = true; dragging = true; overWrap.setPointerCapture(e.pointerId); ovWasPlaying = state === "playing";
  if (ovWasPlaying) { anchorPos = positionNow(); stopActiveAndScheduled(); }
  const pos = ovPosFromX(e.clientX); anchorPos = pos;
  if (ovWasPlaying) { const now = performance.now(); lastScrub = now; seekTo(pos, true); anchorPos = pos; } else drawFrame();
});
overWrap.addEventListener("pointermove", (e) => {
  const r = overCanvas.getBoundingClientRect(); overHair.style.opacity = "1"; overHair.style.left = (e.clientX - r.left) + "px";
  if (!ovActive) return;
  const pos = ovPosFromX(e.clientX); anchorPos = pos;
  if (ovWasPlaying) { const now = performance.now(); if (now - lastScrub > 90) { lastScrub = now; seekTo(pos, true); anchorPos = pos; } } else drawFrame();
});
overWrap.addEventListener("pointerleave", () => { overHair.style.opacity = "0"; });
function endOvDrag(e) {
  if (!ovActive) return; ovActive = false; dragging = false;
  // Only recompute from the event when it carries real coords; otherwise keep the
  // last scrub position (anchorPos) so a synthetic/cancel event can't jump to 0:00.
  if (e && typeof e.clientX === "number") anchorPos = ovPosFromX(e.clientX);
  if (ovWasPlaying) startTrack(currentIndex, ctx.currentTime + 0.01, anchorPos, true); else drawFrame();
}
overWrap.addEventListener("pointerup", endOvDrag);
overWrap.addEventListener("pointercancel", endOvDrag);

/* ---------- drag safety net ---------- */
// A pointer release or lost capture ANYWHERE ends any active scrub, so the app can
// never get wedged in a drag state — e.g. capture stolen by a re-render, or the button
// released off the waveform. Every end handler is idempotent, so double-firing (element
// listener + this) is harmless; the unconditional dragging=false is the final guarantee.
function endAllDrags(e) { endRollDrag(); endOvDrag(e); dragging = false; rollWrap.classList.remove("grabbing"); }
window.addEventListener("pointerup", endAllDrags);
window.addEventListener("pointercancel", endAllDrags);
window.addEventListener("blur", () => endAllDrags());
rollWrap.addEventListener("lostpointercapture", endRollDrag);
overWrap.addEventListener("lostpointercapture", (e) => endOvDrag(e));

/* ---------- panel motion ----------
   No mouse parallax: the tilt is a fixed baseline (see .overlay CSS). While a track is
   playing we layer a slow, tiny "ocean roll" on top via --rock. We only write the var
   while playing and land on 0 once when it stops, so idle frames don't re-composite
   every backdrop-filter glass panel (the main visual cost). */
const overlay = $("overlay");
let _rockIdle = false;
function updateRock(t) {
  if (state === "playing") {
    // two detuned sines → a gentle, non-repeating sway (~±1°), like a ship at anchor
    const r = Math.sin(t * 0.9) * 0.7 + Math.sin(t * 0.37 + 1.3) * 0.3;
    overlay.style.setProperty("--rock", r.toFixed(4));
    _rockIdle = false;
  } else if (!_rockIdle) {
    overlay.style.setProperty("--rock", "0");
    _rockIdle = true;
  }
}

/* ---------- queue panel ---------- */
const queueListEl = $("queueList");
function toggleQueue(force) {
  queueOpen = typeof force === "boolean" ? force : !queueOpen;
  $("queuePanel").classList.toggle("open", queueOpen);
  $("queueToggle").classList.toggle("on", queueOpen);
  document.body.classList.toggle("queue-open", queueOpen);
  // the stage width transitions over ~0.34s; re-fit canvases each frame until it settles
  _stageResizing = true;
  clearTimeout(_stageResizeTimer);
  _stageResizeTimer = setTimeout(() => { _stageResizing = false; resizeCanvases(); drawFrame(); }, 380);
}
// Full rebuild of the list — call on structural changes (load / remove / reorder / reset).
// updateCard() handles the cheap active-row highlight on every transport move.
function renderQueue() {
  $("queueCount").textContent = queue.length;
  queueListEl.innerHTML = "";
  if (!queue.length) {
    const empty = document.createElement("div");
    empty.className = "queue-empty";
    empty.textContent = "no tracks yet — load or drop audio files to build the queue";
    queueListEl.appendChild(empty);
    return;
  }
  queue.forEach((track, i) => {
    const row = document.createElement("div");
    row.className = "queue-row" + (i === currentIndex ? " active" : "");
    row.dataset.idx = i;
    row.draggable = true;

    const idx = document.createElement("span");
    idx.className = "qidx"; idx.textContent = i === currentIndex ? "▶" : (i + 1);

    const thumb = document.createElement("span");
    thumb.className = "qthumb";
    if (track.thumb) { const im = document.createElement("img"); im.alt = "cover"; im.src = track.thumb; thumb.appendChild(im); }
    else thumb.textContent = "♫";

    const meta = document.createElement("div");
    meta.className = "qmeta";
    const name = document.createElement("div"); name.className = "qname"; name.textContent = track.name;
    const bpm = document.createElement("div"); bpm.className = "qbpm"; bpm.textContent = (track.bpm ? track.bpm + " BPM" : "— BPM") + " · " + fmt(track.duration);
    meta.appendChild(name); meta.appendChild(bpm);

    const remove = document.createElement("button");
    remove.className = "qremove"; remove.type = "button"; remove.textContent = "✕"; remove.title = "remove from queue";
    remove.addEventListener("click", (e) => { e.stopPropagation(); removeTrack(i); });

    row.appendChild(idx); row.appendChild(thumb); row.appendChild(meta); row.appendChild(remove);
    row.addEventListener("click", () => gotoTrack(i, false));
    row.addEventListener("dragstart", (e) => { dragFromIdx = i; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(i)); } catch (err) {} });
    row.addEventListener("dragend", () => { dragFromIdx = null; clearDropHints(); row.classList.remove("dragging"); });
    row.addEventListener("dragover", (e) => {
      if (dragFromIdx === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      const r = row.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2;
      clearDropHints(); row.classList.add(after ? "drop-after" : "drop-before");
    });
    row.addEventListener("drop", (e) => {
      if (dragFromIdx === null) return;
      e.preventDefault();
      const r = row.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2;
      moveTrack(dragFromIdx, i + (after ? 1 : 0));
    });
    queueListEl.appendChild(row);
  });
}
function clearDropHints() { queueListEl.querySelectorAll(".drop-before,.drop-after").forEach(el => el.classList.remove("drop-before", "drop-after")); }
function highlightActiveRow() {
  queueListEl.querySelectorAll(".queue-row").forEach(row => {
    const i = Number(row.dataset.idx);
    const active = i === currentIndex;
    row.classList.toggle("active", active);
    const idx = row.querySelector(".qidx"); if (idx) idx.textContent = active ? "▶" : (i + 1);
  });
}
// Reorder without interrupting the audible track: we re-derive currentIndex from the
// track object that was playing, then just reschedule the (possibly new) next track.
function moveTrack(from, insertAt) {
  if (from === null || from < 0 || from >= queue.length) return;
  const cur = queue[currentIndex];
  const moving = queue[from];
  queue.splice(from, 1);
  if (from < insertAt) insertAt--;
  insertAt = Math.max(0, Math.min(queue.length, insertAt));
  if (insertAt === from) return;
  queue.splice(insertAt, 0, moving);
  currentIndex = queue.indexOf(cur);
  if (state === "playing") { clearScheduled(); scheduleFollowing(); }
  renderQueue(); updateCard(); drawFrame();
}
function removeTrack(i) {
  if (i < 0 || i >= queue.length) return;
  const wasActive = i === currentIndex;
  const cur = queue[currentIndex];
  const t = queue[i];
  if (t && t.thumb) { try { URL.revokeObjectURL(t.thumb); } catch (e) {} }
  if (wasActive) stopActiveAndScheduled();
  queue.splice(i, 1);
  $("subTotal").textContent = queue.length;
  if (!queue.length) {
    currentIndex = -1; anchorPos = 0; state = "idle";
    renderQueue(); updateCard(); syncPlayIcon(); drawFrame(); return;
  }
  if (wasActive) {
    currentIndex = Math.min(i, queue.length - 1);
    anchorPos = cueOffset(currentIndex);
    if (state === "playing") startTrack(currentIndex, ctx.currentTime + 0.03, anchorPos, true);
    else if (state === "idle") state = "stopped";
  } else {
    currentIndex = queue.indexOf(cur);
    if (currentIndex < 0) currentIndex = Math.min(i, queue.length - 1);
    if (state === "playing") { clearScheduled(); scheduleFollowing(); }
  }
  renderQueue(); updateCard(); syncPlayIcon(); drawFrame();
}
$("queueToggle").onclick = () => toggleQueue();
$("queueClose").onclick = () => toggleQueue(false);
// authoritative re-fit once the stage width has actually finished animating (fires
// independent of rAF/timer throttling, so the waveform is always crisp at the final size).
$("stage").addEventListener("transitionend", (e) => {
  if (e.propertyName !== "width") return;
  _stageResizing = false; clearTimeout(_stageResizeTimer); resizeCanvases(); drawFrame();
});

/* ---------- keyboard shortcuts ---------- */
function nudgeSeek(delta) {
  ensureCtx(); if (!queue.length || currentIndex < 0) return;
  const dur = queue[currentIndex].buffer.duration;
  const pos = Math.max(0, Math.min(dur - 0.05, positionNow() + delta));
  anchorPos = pos;
  if (state === "playing") startTrack(currentIndex, ctx.currentTime + 0.01, pos, true);
  else drawFrame();
}
window.addEventListener("keydown", (e) => {
  if (!$("emojiModal").hidden) return;                 // modal owns its keys
  if (e.metaKey || e.ctrlKey || e.altKey) return;      // leave browser/OS shortcuts alone
  switch (e.key) {
    case " ": e.preventDefault(); play(); break;
    case "ArrowLeft": e.preventDefault(); e.shiftKey ? prevTrack() : nudgeSeek(-5); break;
    case "ArrowRight": e.preventDefault(); e.shiftKey ? nextTrack() : nudgeSeek(5); break;
    case "1": pressReaction("clap"); break;
    case "2": pressReaction("fire"); break;
    case "3": pressReaction("good"); break;
    case "4": pressReaction("heat"); break;
    case "q": case "Q": toggleQueue(); break;
    default: return;
  }
});

/* ---------- boot ---------- */
window.addEventListener("resize", () => { _varCache = {}; resizeCanvases(); drawFrame(); });
buildLufsTiles(); resizeCanvases(); syncPlayIcon(); requestAnimationFrame(loop);
</script>
