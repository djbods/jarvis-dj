<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submission Player — v3</title>
<style>
  :root {
    --bg-1: #3a2d5c; --bg-2: #6a4a7a; --bg-3: #c98ba0; --bg-glow: rgba(255,170,200,0.35);
    --tile-glass: rgba(228,228,235,0.10);
    --panel-glass: rgba(60,56,78,0.55);
    --glass-border: rgba(255,255,255,0.28);
    --glass-hi: rgba(255,255,255,0.5);
    --wave-past: rgba(120,118,145,0.5);
    --wave-future: rgba(255,255,255,0.92);
    --needle: #ffd36b;
    --text: #fff; --muted: rgba(255,255,255,0.62); --ink: #2a2436;
    --orange: #ff7a2f; --green: #47d16a; --yellow: #ffcf47;
    --silver: linear-gradient(180deg,#e8e8ef,#b9b9c8);
    --t-fast: 0.15s ease;
    --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font); color: var(--text); display: grid; place-items: center; min-height: 100vh;
    background:
      radial-gradient(120% 90% at 80% -10%, var(--bg-glow), transparent 55%),
      linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 130%);
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0 5px, rgba(0,0,0,0.03) 5px 6px);
    pointer-events: none;
  }
  body.drag-over::after {
    content: "drop audio files to queue"; position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(20,10,40,0.55); font-size: 24px; letter-spacing: 2px; z-index: 999; pointer-events: none;
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900; }
  .toolbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(30,24,44,0.6);
    border: 1px solid var(--glass-border); border-radius: 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 13px;
  }
  .toolbar button, .toolbar label {
    font-family: var(--font); font-size: 13px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.1);
    color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: background var(--t-fast), transform var(--t-fast);
  }
  .toolbar button:hover, .toolbar label:hover { background: rgba(255,255,255,0.2); }
  .toolbar button:active { transform: scale(0.97); }
  .toolbar .toggle.on { background: var(--orange); border-color: var(--orange); }
  .toolbar .readout { color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }
  #fileInput { display: none; }
  /* reserve a fixed side gutter (not a %) so the LUFS meter, which sits ~46px past the
     wave's right edge, always has room on tablet / small-desktop viewports */
  .stage { width: min(1000px, calc(100vw - 160px)); perspective: 1300px; padding: 40px 10px; }
  .overlay {
    position: relative; transform-style: preserve-3d;
    /* fixed perspective tilt — the panel sits at a static angle (no mouse parallax).
       a slow "ocean roll" (--rock, written only while playing) layers on top. origin
       sits low near the transport so controls barely move while the top sways. */
    --tilt-x: 8deg; --tilt-z: -1.4deg;
    transform-origin: 50% 82%;
    transform:
      rotateX(var(--tilt-x))
      rotateZ(calc(var(--tilt-z) + var(--rock, 0) * 1deg))
      rotateY(calc(var(--rock, 0) * 0.5deg));
    will-change: transform;
  }
  .overlay.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%,100% { translate: 0 0; } 15% { translate: -8px 4px; } 30% { translate: 7px -5px; }
    45% { translate: -6px -3px; } 60% { translate: 5px 4px; } 75% { translate: -3px 2px; }
  }
  .layer {
    transform: translate3d(calc(var(--px,0)*var(--drift,0)*1px), calc(var(--py,0)*var(--drift,0)*1px), var(--depth,0px));
    transition: transform 0.12s ease-out; will-change: transform;
  }
  .meter { --depth: 6px; --drift: 10; margin-bottom: 6px; }
  .meter .row {
    display: flex; align-items: center; justify-content: space-between; font-variant-numeric: tabular-nums;
    font-size: 12px; letter-spacing: 0.5px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .meter .read { color: #cfe; display: flex; gap: 10px; }
  .meter .read span { color: rgba(255,255,255,0.55); }
  .wave-wrap { --depth: 20px; --drift: 14; position: relative; margin-top: 92px; }
  .rolling {
    position: relative; height: 280px; cursor: grab;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .rolling.grabbing { cursor: grabbing; }
  #rolling { width: 100%; height: 100%; display: block; touch-action: none; }
  .needle {
    position: absolute; top: 4%; bottom: 4%; left: 50%; width: 2px; margin-left: -1px; background: var(--needle);
    box-shadow: 0 0 12px 1px rgba(255,211,107,0.95); pointer-events: none; z-index: 3;
    /* no left-transition: it's repositioned every frame, so any easing makes it lag the waveform */
  }
  .transition-marker {
    position: absolute; top: 4%; bottom: 4%; width: 3px; background: rgba(255,80,80,0.8);
    box-shadow: 0 0 10px 2px rgba(255,80,80,0.6); pointer-events: none; z-index: 3;
  }
  .last-beat-marker {
    position: absolute; top: 4%; bottom: 4%; width: 2px; background: rgba(255,200,50,0.6);
    box-shadow: 0 0 8px 1px rgba(255,200,50,0.4); pointer-events: none; z-index: 2;
  }
  .beat-counter {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 11px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,0.7);
    pointer-events: none; z-index: 4;
  }
  .beat-counter .current-beat {
    color: var(--needle); font-size: 14px;
  }
  .wave-glow {
    position: absolute; inset: -20px; border-radius: 24px; pointer-events: none; opacity: 0;
    background: radial-gradient(60% 80% at 50% 50%, var(--glow, #fff), transparent 70%); z-index: 1; transition: opacity 0.1s linear;
  }
  .swipe-ghost { position: absolute; inset: 0; z-index: 2; pointer-events: none; animation: swipeLeft 0.55s cubic-bezier(0.4,0,0.2,1) forwards; }
  @keyframes swipeLeft { from { transform: translateX(0); opacity: 0.95; } to { transform: translateX(-115%); opacity: 0; } }
  .tstamp {
    position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.85); text-shadow: 0 1px 4px rgba(0,0,0,0.6); pointer-events: none; z-index: 3;
  }
  .tstamp.start { left: 10px; } .tstamp.end { right: 10px; }
  .tstamp.now { left: 50%; top: -22px; transform: translateX(-50%); color: var(--needle); font-weight: 700; font-size: 14px; }
  /* live LUFS meter — CDJ-style discrete LED ladder (momentary, K-weighted) */
  .lufs {
    position: absolute; top: 0; right: -46px; height: 280px; width: 34px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  .lufs .lufs-label { font-size: 9px; letter-spacing: 1.5px; color: rgba(255,255,255,0.55); }
  .lufs .lufs-track {
    flex: 1; width: 26px; display: flex; flex-direction: column-reverse; gap: 2px;
    padding: 4px; border-radius: 6px; background: rgba(6,5,14,0.55);
    border: 1px solid var(--glass-border); box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .lufs .lufs-tile {
    flex: 1; border-radius: 2px; background: var(--off);
    transition: background-color 0.04s linear, box-shadow 0.04s linear;
  }
  .lufs .lufs-tile.green { --on: #35e06a; --off: rgba(53,224,106,0.12); }
  .lufs .lufs-tile.amber { --on: #ffce3a; --off: rgba(255,206,58,0.12); }
  .lufs .lufs-tile.red   { --on: #ff4646; --off: rgba(255,70,70,0.12); }
  .lufs .lufs-tile.on {
    background: var(--on);
    box-shadow: 0 0 6px var(--on), inset 0 0 2px rgba(255,255,255,0.55);
  }
  .lufs .lufs-tile.peak {
    background: var(--on);
    box-shadow: 0 0 9px var(--on), inset 0 0 3px rgba(255,255,255,0.85);
    outline: 1px solid rgba(255,255,255,0.85);
  }
  .lufs .lufs-value { font-size: 11px; font-variant-numeric: tabular-nums; color: #dfe7ff; font-weight: 600; }
  /* full-track overview — now tight below the rolling waveform, and scrubbable */
  .overview-wrap { position: relative; height: 54px; margin-top: 6px; cursor: pointer; }
  #overview { width: 100%; height: 100%; display: block; touch-action: none; }
  .overview-marker {
    position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--needle);
    box-shadow: 0 0 6px rgba(255,211,107,0.8); left: 0; pointer-events: none;
  }
  .overview-hair { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.35); left: 0; pointer-events: none; opacity: 0; }
  .sub-card {
    --depth: 60px; --drift: 26; position: absolute; top: 118px; left: 50%; margin-left: -185px; width: 370px; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--tile-glass);
    border: 1px solid var(--glass-border); border-radius: 16px; backdrop-filter: blur(10px) saturate(1.15); -webkit-backdrop-filter: blur(10px) saturate(1.15);
    box-shadow: 0 18px 40px rgba(20,10,40,0.35), inset 0 1px 0 var(--glass-hi);
  }
  .next-card {
    --depth: 40px; --drift: 18; position: absolute; top: 118px; left: 50%; margin-left: 155px; width: 240px; z-index: 4;
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(40,32,60,0.4);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 12px 28px rgba(20,10,40,0.25); opacity: 0.8; transition: opacity 0.3s, transform 0.3s;
  }
  .next-card:hover { opacity: 1; transform: scale(1.02); }
  .next-card .avatar { width: 36px; height: 36px; font-size: 14px; }
  .next-card .meta { flex: 1; min-width: 0; }
  .next-card .name { font-size: 13px; opacity: 0.9; }
  .next-card .next-label { font-size: 9px; letter-spacing: 1px; color: var(--orange); text-transform: uppercase; font-weight: 700; }
  .next-card .bpm-match { font-size: 10px; color: rgba(255,255,255,0.6); }
  .big-emoji-burst {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; z-index: 1000;
    pointer-events: none; animation: burstPulse 0.8s ease-out forwards; text-shadow: 0 0 60px rgba(255,255,255,0.8);
  }
  @keyframes burstPulse {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
  }
  .sub-card .avatar {
    width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfcfe0, #6d6d84); border: 1px solid rgba(255,255,255,0.5);
    display: grid; place-items: center; color: rgba(255,255,255,0.9); font-size: 18px;
  }
  .sub-card .meta { flex: 1 1 auto; min-width: 0; }
  .sub-card .name {
    font-weight: 800; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub-card .elo-line { font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,0.78); }
  .sub-card .tier {
    position: absolute; bottom: 8px; right: 14px; font-size: 10px; font-weight: 800; letter-spacing: 2px;
    background: var(--silver); color: #4a4a5a; padding: 2px 7px; border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .sub-card .pips {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 8px; background: rgba(60,50,80,0.4);
    border: 1px solid rgba(255,255,255,0.25); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px; align-self: flex-start;
  }
  .sub-card .pips b { background: #bfa4ff; border-radius: 50%; box-shadow: 0 0 6px rgba(191,164,255,0.8); }
  .transport {
    --depth: 42px; --drift: 18; position: relative; z-index: 4; margin: 16px auto 0; width: max-content;
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--panel-glass);
    border: 1px solid var(--glass-border); border-radius: 20px; backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1);
    box-shadow: 0 16px 34px rgba(20,10,40,0.5), inset 0 1px 0 var(--glass-hi);
  }
  .tbtn { border: none; cursor: pointer; display: grid; place-items: center; color: #fff; font-family: var(--font); transition: transform var(--t-fast), background var(--t-fast), filter var(--t-fast); }
  .tbtn:active { transform: scale(0.94); }
  .tbtn.chip { width: 34px; height: 34px; border-radius: 9px; font-size: 16px; background: rgba(255,255,255,0.16); }
  .tbtn.chip.green { background: var(--green); }
  .tbtn.chip:hover { filter: brightness(1.12); }
  .tbtn.round { width: 34px; height: 34px; border-radius: 50%; background: transparent; }
  .tbtn.round:hover { background: rgba(255,255,255,0.18); }
  .tbtn.round svg { width: 20px; height: 20px; fill: #fff; }
  .tbtn.play { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.95); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
  .tbtn.play svg { width: 22px; height: 22px; fill: var(--ink); }
  .tbtn.stop { width: 34px; height: 34px; border-radius: 9px; background: var(--orange); box-shadow: 0 4px 12px rgba(255,122,47,0.45); }
  .tbtn.stop::after { content: ""; width: 12px; height: 12px; background: #fff; border-radius: 2px; }
  .tbtn.flame { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,122,47,0.22); font-size: 17px; }
  .elo {
    --depth: 50px; --drift: 22; position: absolute; right: 6px; bottom: 4px; z-index: 6; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--tile-glass); border: 1px solid var(--glass-border); border-radius: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 30px rgba(20,10,40,0.35), inset 0 1px 0 var(--glass-hi); font-variant-numeric: tabular-nums;
  }
  .elo .num { font-size: 22px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
  .elo .num.lo { opacity: 0.85; }
  .elo .thumb { position: relative; width: 78px; height: 54px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg,#8a6bd6,#d67ab0); border: 1px solid rgba(255,255,255,0.4); display: grid; place-items: center; }
  .elo .thumb .face { font-size: 40px; transform: scaleX(1.5) scaleY(0.85); filter: contrast(1.1) saturate(1.3); }
  .elo .thumb .tag { position: absolute; bottom: 2px; font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  .counter { --depth: 30px; --drift: 12; text-align: center; margin-top: 14px; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.85); text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.5); text-align: center; }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="toolbar">
    <label for="fileInput">＋ Load tracks</label>
    <input id="fileInput" type="file" accept="audio/*" multiple />
    <button class="toggle" id="bpmToggle">BPM cue: off</button>
    <span class="readout" id="readout">no tracks loaded</span>
  </div>

  <div class="stage" id="stage">
    <div class="overlay" id="overlay">
      <div class="meter layer">
        <div class="row">
          <span id="luRead">-13.8 LU</span>
          <span class="read" id="analysisRead">BPM — <span>|</span> onset — <span>|</span> cue —</span>
        </div>
      </div>

      <div class="wave-wrap layer">
        <div class="rolling" id="rolling-wrap">
          <div class="wave-glow" id="waveGlow"></div>
          <canvas id="rolling"></canvas>
          <div class="needle" id="needle"></div>
          <div class="last-beat-marker" id="lastBeatMarker" style="display: none;"></div>
          <div class="transition-marker" id="transitionMarker" style="display: none;"></div>
          <span class="tstamp start" id="tStart">0:00</span>
          <span class="tstamp now" id="tNow">0:00</span>
          <span class="tstamp end" id="tEnd">0:00</span>
        </div>
        <div class="lufs" id="lufsMeter">
          <div class="lufs-label">LUFS</div>
          <div class="lufs-track" id="lufsTrack"></div>
          <div class="lufs-value" id="lufsValue">-∞</div>
        </div>
        <div class="overview-wrap" id="overview-wrap">
          <canvas id="overview"></canvas>
          <div class="overview-marker" id="overviewMarker"></div>
          <div class="overview-hair" id="overviewHair"></div>
        </div>
      </div>

      <div class="sub-card layer">
        <div class="avatar">♫</div>
        <div class="meta">
          <div class="name" id="trackName">Awaiting upload</div>
          <div class="elo-line" id="trackElo">ELO 1025</div>
        </div>
        <div class="pips"><b></b><b></b><b></b><b></b></div>
        <span class="tier">SILVER</span>
      </div>

      <div class="next-card layer" id="nextCard" style="display: none;">
        <div class="avatar">⏭</div>
        <div class="meta">
          <div class="next-label">NEXT UP</div>
          <div class="name" id="nextTrackName">—</div>
          <div class="bpm-match" id="nextTrackInfo">—</div>
        </div>
      </div>

      <div class="transport layer">
        <button class="tbtn chip" data-react="clap" title="clap">👏</button>
        <button class="tbtn chip" data-react="fire" title="fire">🔥</button>
        <button class="tbtn chip green" data-react="good" title="good">■</button>
        <button class="tbtn round" id="prev" title="previous / restart"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="tbtn play" id="play" title="play / pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="tbtn round" id="next" title="next submission"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg></button>
        <button class="tbtn stop" id="stop" title="stop"></button>
        <button class="tbtn flame" data-react="fire" title="heat">🔥</button>
        <button class="tbtn round" id="reset" title="reset queue"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      </div>

      <div class="elo layer">
        <span class="num lo">1195</span>
        <span class="thumb"><span class="face">😎</span><span class="tag">swag</span></span>
        <span class="num">1300</span>
      </div>

      <div class="counter layer">Submission <b id="subN">0</b> / <b id="subTotal">0</b></div>
    </div>
  </div>

  <div class="hint">load tracks &middot; drag waveforms to scrub &middot; spam reactions to hype &middot; next track appears in red</div>

<script>
"use strict";
const WINDOW_SECONDS = 5;
const PEAK_RATE = 220;
const REACTIONS = {
  clap: { emoji: "👏", colour: "#ffcf47", rgb: [255,207,71] },
  fire: { emoji: "🔥", colour: "#ff7a2f", rgb: [255,122,47] },
  good: { emoji: "💚", colour: "#47d16a", rgb: [71,209,106] },
};

let ctx = null, master = null;
const queue = [];
let bpmMode = false;
let currentIndex = -1;
let activeSource = null;
let activeGain = null; // Gain node for active track (crossfade control)
let scheduledNext = null;
let fadingOut = null;  // the outgoing source during a crossfade, so teardown can hard-stop it
let anchorCtxTime = 0;
let anchorPos = 0;
let state = "idle";
let dragging = false;
let tally = { clap: 0, fire: 0, good: 0 };

// hype
let hype = 0;
let hypeRGB = [255,255,255];
let hypeEmoji = "✨";

// live LUFS metering (CDJ-style LED ladder)
let lufsAnalyser = null, lufsBuf = null;
let lufsTileEls = [];
let lufsSmoothed = -70;  // ballistic value (dB) — fast attack, slow release
let lufsPeakDb = -70;    // peak-hold (dB), falls each frame
const LUFS_FLOOR = -42, LUFS_CEIL = -3, LUFS_TILES = 18;

const $ = (id) => document.getElementById(id);
const rollCanvas = $("rolling"), rollWrap = $("rolling-wrap");
const overCanvas = $("overview"), overWrap = $("overview-wrap"), overMarker = $("overviewMarker"), overHair = $("overviewHair");
const fxCanvas = $("fx");
const rctx = rollCanvas.getContext("2d");
const octx = overCanvas.getContext("2d");
const fxctx = fxCanvas.getContext("2d");

/* ---------- engine ---------- */
function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();

let _ovPast = null, _ovFuture = null, _ovIndex = -1, _ovW = 0;
function buildOverviewCache() {
  const track = queue[currentIndex]; const { w, h } = overSize;
  if (!track || w <= 0) { _ovPast = _ovFuture = null; _ovIndex = -1; _ovW = 0; return; }
  const dpr = window.devicePixelRatio || 1;

    const c = document.createElement("canvas");

    return { c, cc };
  };
  const past = mk(), future = mk();
  const mid = h / 2, maxBar = h * 0.42;
  const pastCol = getVar("--wave-past"), futCol = "rgba(255,255,255,0.65)";
  past.cc.fillStyle = pastCol; future.cc.fillStyle = futCol;
  for (let x = 0; x < w; x += 2) {
    const t = (x / w) * track.duration;
    const amp = peakMax(track, t, t + (track.duration / w));
    const bh = Math.max(1, amp * maxBar);
    past.cc.fillRect(x, mid - bh, 1.4, bh * 2);
    future.cc.fillRect(x, mid - bh, 1.4, bh * 2);
  }
  _ovPast = past.c; _ovFuture = future.c; _ovIndex = currentIndex; _ovW = w;
}
function drawOverview(pos) {
  const { w, h } = overSize; octx.clearRect(0, 0, w, h);
  const track = queue[currentIndex]; const mid = h / 2, maxBar = h * 0.42;
  if (!track) {                             // idle (pre-load) animation — no cache

function getVar(name) { if (_varCache[name]) return _varCache[name]; const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); _varCache[name] = v; return v; }

// Cache hot-path element refs so drawFrame() isn't doing getElementById every frame.
const _elTStart = $("tStart"), _elTEnd = $("tEnd"), _elTNow = $("tNow"), _elGlow = $("waveGlow");

// Build the LED ladder: bottom green, amber near the top, red at the ceiling.
function buildLufsTiles() {
  const track = $("lufsTrack"); if (!track) return;
  track.innerHTML = ""; lufsTileEls = [];
  for (let i = 0; i < LUFS_TILES; i++) {
    const d = document.createElement("div");
    d.className = "lufs-tile " + (i >= 15 ? "red" : i >= 11 ? "amber" : "green");
    track.appendChild(d); lufsTileEls.push(d);
  }
}

// Live momentary loudness (K-weighted, ITU-R BS.1770). Reads a ~46ms slice each frame
// and drives the LED ladder with hardware-style ballistics: fast attack, slower release,
// plus a floating peak-hold LED — snappy like a CDJ master meter, not a laggy bar.
function updateLufs() {
  if (!lufsAnalyser) return;
  lufsAnalyser.getFloatTimeDomainData(lufsBuf);
  let sum = 0; for (let i = 0; i < lufsBuf.length; i++) { const x = lufsBuf[i]; sum += x * x; }
  const ms = sum / lufsBuf.length;
  const inst = ms > 1e-10 ? -0.691 + 10 * Math.log10(ms) : -70;

  // asymmetric ballistics (PPM feel): jump up fast, ease down slow
  lufsSmoothed += (inst - lufsSmoothed) * (inst > lufsSmoothed ? 0.55 : 0.14);
  lufsPeakDb = lufsSmoothed >= lufsPeakDb ? lufsSmoothed : Math.max(lufsSmoothed, lufsPeakDb - 0.45);

  const span = LUFS_CEIL - LUFS_FLOOR;
  const pct = Math.max(0, Math.min(1, (lufsSmoothed - LUFS_FLOOR) / span));
  const pctPeak = Math.max(0, Math.min(1, (lufsPeakDb - LUFS_FLOOR) / span));
  const litCount = Math.round(pct * LUFS_TILES);
  const peakIdx = pctPeak > 0.001 ? Math.max(0, Math.round(pctPeak * LUFS_TILES) - 1) : -1;

  for (let i = 0; i < lufsTileEls.length; i++) {
    const el = lufsTileEls[i];
    const isPeak = i === peakIdx;
    const on = i < litCount || isPeak;
    if (el._on !== on) { el.classList.toggle("on", on); el._on = on; }
    if (el._peak !== isPeak) { el.classList.toggle("peak", isPeak); el._peak = isPeak; }
  }

  const label = lufsSmoothed > LUFS_FLOOR + 0.4 ? lufsSmoothed.toFixed(1) : "-∞";
  $("lufsValue").textContent = label;
  $("luRead").textContent = label + " LU";
}

/* ---------- particles (confetti + emoji) ---------- */
const particles = [];
function spawnBurst(key, sx, sy, level) {
  const R = REACTIONS[key] || { rgb: [255,255,255], emoji: "✨" };
  const n = Math.round(5 + level * 30);
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * (0.5 + level * 2.6);   // spread widens with hype -> explosion
    const speed = 160 + Math.random() * (240 + level * 720);
    const confetti = Math.random() < (0.35 + level * 0.5);
    particles.push({
      x: sx, y: sy, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, g: 1500,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14,
      life: 0.7 + Math.random() * 0.9, max: 1.6,
      type: confetti ? "confetti" : "emoji", rgb: R.rgb, emoji: R.emoji,
      size: confetti ? 6 + Math.random() * 8 : 22 + Math.random() * 16
    });
  }
}
function floodFromWave(key) {
  const r = rollCanvas.getBoundingClientRect();
  const sx = r.left + r.width / 2, sy = r.top + r.height / 2;
  const R = REACTIONS[key] || { rgb: [255,255,255], emoji: "✨" };
  const n = key ? 60 : 22;
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * 6.28;
    const speed = 200 + Math.random() * 780;
    const confetti = Math.random() < 0.6;
    particles.push({
      x: sx + (Math.random() - 0.5) * r.width * 0.7, y: sy + (Math.random() - 0.5) * 60,
      vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed - 200, g: 1400,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 16,
      life: 0.9 + Math.random() * 1.1, max: 2.0,
      type: confetti ? "confetti" : "emoji", rgb: R.rgb, emoji: R.emoji,
      size: confetti ? 7 + Math.random() * 10 : 24 + Math.random() * 18

  }
}
let fxHadParticles = false;

  }
}

  if (particles.length === 0) { if (fxHadParticles) { fxctx.clearRect(0, 0, window.innerWidth, window.innerHeight); fxHadParticles = false; } return; }
  fxHadParticles = true;
  fxctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    fxctx.globalAlpha = a;
    fxctx.save(); fxctx.translate(p.x, p.y); fxctx.rotate(p.rot);

/* ---------- reactions / hype ---------- */

function resetTally() { tally = { clap: 0, fire: 0, good: 0 }; }
function doSwipe() {
  try {
    const ghost = document.createElement("canvas"); ghost.width = rollCanvas.width; ghost.height = rollCanvas.height; ghost.className = "swipe-ghost";
    ghost.getContext("2d").drawImage(rollCanvas, 0, 0); rollWrap.appendChild(ghost); setTimeout(() => ghost.remove(), 600);
  } catch (e) {}
}
function runTransitionFX(key) {
  doSwipe();
  const ov = $("overlay"); ov.classList.remove("shake"); void ov.offsetWidth; ov.classList.add("shake");
  if (key) { hype = 1; hypeRGB = REACTIONS[key].rgb.slice(); hypeEmoji = REACTIONS[key].emoji; }
  floodFromWave(key);
}
function pressReaction(key, btn) {
  tally[key] = (tally[key] || 0) + 1;
  hype = Math.min(1, hype + 0.16);
  hypeRGB = REACTIONS[key].rgb.slice(); hypeEmoji = REACTIONS[key].emoji;
  const r = btn.getBoundingClientRect();
  spawnBurst(key, r.left + r.width / 2, r.top + r.height / 2, hype);
}

/* ---------- ui sync ---------- */
const PLAY_PATH = "M8 5v14l11-7z", PAUSE_PATH = "M6 5h4v14H6zm8 0h4v14h-4z";
function syncPlayIcon() { $("playIcon").setAttribute("d", state === "playing" ? PAUSE_PATH : PLAY_PATH); }
function updateCard() {
  const track = queue[currentIndex];
  if (!track) { $("readout").textContent = "no tracks loaded"; return; }
  $("trackName").textContent = track.name.slice(0, 30);
  $("subN").textContent = currentIndex + 1;
  const cue = cueOffset(currentIndex);
  const trans = transitionPoint(currentIndex);

  // Show DJ mode info
  let modeInfo = "";

    modeInfo = " (DJ)";
    if (track.lastBeatPoint !== null) {
      modeInfo += ` <span style="color:var(--green)">✓ end ${fmt(track.lastBeatPoint)}</span>`;
    }
    if (track.phraseStart !== null) {
      modeInfo += ` <span style="color:var(--yellow)">♪ start ${fmt(track.phraseStart)}</span>`;
    }

      const currentPos = positionNow();
      const beatsRemaining = Math.round((scheduledNext.transitionTime - currentPos) / (60 / (track.bpm || 120)));

      }

  }

  $("readout").textContent = queue.length + " track" + (queue.length > 1 ? "s" : "") + " · #" + (currentIndex + 1);

  const nextCard = $("nextCard");
  if (nextIdx < queue.length) {
    const next = queue[nextIdx];
    $("nextTrackName").textContent = next.name.slice(0, 20);

    // BPM match indicator

      const bpmDiff = Math.abs(track.bpm - next.bpm);
      if (bpmDiff === 0) {
        $("nextTrackInfo").innerHTML = `<span style="color: var(--green)">● Perfect BPM match (${next.bpm})</span>`;
      } else if (bpmDiff <= 2) {
        $("nextTrackInfo").innerHTML = `<span style="color: var(--yellow)">◐ Close (${track.bpm} → ${next.bpm})</span>`;
      } else {
        $("nextTrackInfo").innerHTML = `<span style="color: rgba(255,255,255,0.5)">○ ${track.bpm} → ${next.bpm}</span>`;
      }
    } else {
      $("nextTrackInfo").textContent = next.bpm ? `BPM ${next.bpm}` : "—";
    }

  }

/* ---------- main loop ---------- */
let lastT = performance.now() / 1000;
function loop() {
  const now = performance.now() / 1000; let dt = now - lastT; lastT = now; if (dt > 0.05) dt = 0.05;
  // hype decays
  if (hype > 0) { hype = Math.max(0, hype - dt * 0.6); if (hype < 0.02) hypeRGB = [255,255,255]; }
  // Commit a scheduled transition the instant we reach it. Loop-driven (not a timer)
  // so it stays in lock-step with the audio clock and can't fire after a teardown.
  if (state === "playing" && ctx && scheduledNext && ctx.currentTime >= scheduledNext.startTime) commitTransition();
  drawFrame();
  updateLufs();
  updateRock(now);
  stepParticles(dt); drawParticles();
  requestAnimationFrame(loop);
}

/* ---------- wiring ---------- */
$("play").onclick = () => play();
$("stop").onclick = () => stopAll();
$("prev").onclick = () => prevTrack();
$("next").onclick = () => nextTrack();
$("reset").onclick = () => resetQueue();
$("bpmToggle").onclick = () => {
  bpmMode = !bpmMode; $("bpmToggle").textContent = "BPM cue: " + (bpmMode ? "on" : "off"); $("bpmToggle").classList.toggle("on", bpmMode);
  if (scheduledNext) scheduleFollowing(); updateCard();
};
document.querySelectorAll("[data-react]").forEach(btn => { btn.addEventListener("click", () => pressReaction(btn.dataset.react, btn)); });
$("fileInput").addEventListener("change", (e) => loadFiles(e.target.files));
document.body.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drag-over"); });
document.body.addEventListener("dragleave", (e) => { if (e.target === document.body) document.body.classList.remove("drag-over"); });
document.body.addEventListener("drop", (e) => { e.preventDefault(); document.body.classList.remove("drag-over"); if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

/* ---------- scrub: rolling waveform (relative drag) ---------- */
let lastScrub = 0;
let rollDragX = 0, rollDragPos = 0, rollWasPlaying = false;
rollWrap.addEventListener("pointerdown", (e) => {
  if (!queue.length) return;
  dragging = true; rollWrap.classList.add("grabbing"); rollWrap.setPointerCapture(e.pointerId);
  rollDragX = e.clientX; rollDragPos = positionNow(); rollWasPlaying = state === "playing";
  if (rollWasPlaying) { anchorPos = positionNow(); stopActiveAndScheduled(); }
});
rollWrap.addEventListener("pointermove", (e) => {
  if (!dragging || rollDragX === 0) return;
  const pps = rollSize.w / WINDOW_SECONDS; const dt = (e.clientX - rollDragX) / pps;
  let pos = rollDragPos - dt; const dur = queue[currentIndex].buffer.duration; pos = Math.max(0, Math.min(dur - 0.01, pos)); anchorPos = pos;
  if (rollWasPlaying) { const now = performance.now(); if (now - lastScrub > 90) { lastScrub = now; seekTo(pos, true); anchorPos = pos; } }

function endRollDrag() {
  if (rollDragX === 0) return; const pos = anchorPos; rollDragX = 0; dragging = false; rollWrap.classList.remove("grabbing");
  if (rollWasPlaying) startTrack(currentIndex, ctx.currentTime + 0.01, pos, true); else drawFrame();
}
rollWrap.addEventListener("pointerup", endRollDrag);
rollWrap.addEventListener("pointercancel", endRollDrag);

/* ---------- scrub: overview waveform (absolute seek: click/drag anywhere) ---------- */
let ovActive = false, ovWasPlaying = false;
function ovPosFromX(clientX) {
  const r = overCanvas.getBoundingClientRect(); let frac = (clientX - r.left) / r.width; frac = Math.max(0, Math.min(1, frac));
  return frac * queue[currentIndex].buffer.duration;
}
overWrap.addEventListener("pointerdown", (e) => {
  if (!queue.length) return;
  ovActive = true; dragging = true; overWrap.setPointerCapture(e.pointerId); ovWasPlaying = state === "playing";
  if (ovWasPlaying) { anchorPos = positionNow(); stopActiveAndScheduled(); }
  const pos = ovPosFromX(e.clientX); anchorPos = pos;
  if (ovWasPlaying) { const now = performance.now(); lastScrub = now; seekTo(pos, true); anchorPos = pos; } else drawFrame();
});
overWrap.addEventListener("pointermove", (e) => {
  const r = overCanvas.getBoundingClientRect(); overHair.style.opacity = "1"; overHair.style.left = (e.clientX - r.left) + "px";
  if (!ovActive) return;
  const pos = ovPosFromX(e.clientX); anchorPos = pos;
  if (ovWasPlaying) { const now = performance.now(); if (now - lastScrub > 90) { lastScrub = now; seekTo(pos, true); anchorPos = pos; } } else drawFrame();
});
overWrap.addEventListener("pointerleave", () => { overHair.style.opacity = "0"; });
function endOvDrag(e) {
  if (!ovActive) return; ovActive = false; dragging = false;
  // Only recompute from the event when it carries real coords; otherwise keep the
  // last scrub position (anchorPos) so a synthetic/cancel event can't jump to 0:00.
  if (e && typeof e.clientX === "number") anchorPos = ovPosFromX(e.clientX);
  if (ovWasPlaying) startTrack(currentIndex, ctx.currentTime + 0.01, anchorPos, true); else drawFrame();
}
overWrap.addEventListener("pointerup", endOvDrag);
overWrap.addEventListener("pointercancel", endOvDrag);

/* ---------- drag safety net ---------- */
// A pointer release or lost capture ANYWHERE ends any active scrub, so the app can
// never get wedged in a drag state — e.g. capture stolen by a re-render, or the button
// released off the waveform. Every end handler is idempotent, so double-firing (element
// listener + this) is harmless; the unconditional dragging=false is the final guarantee.
function endAllDrags(e) { endRollDrag(); endOvDrag(e); dragging = false; rollWrap.classList.remove("grabbing"); }
window.addEventListener("pointerup", endAllDrags);
window.addEventListener("pointercancel", endAllDrags);
window.addEventListener("blur", () => endAllDrags());
rollWrap.addEventListener("lostpointercapture", endRollDrag);
overWrap.addEventListener("lostpointercapture", (e) => endOvDrag(e));

/* ---------- panel motion ----------
   No mouse parallax: the tilt is a fixed baseline (see .overlay CSS). While a track is
   playing we layer a slow, tiny "ocean roll" on top via --rock. We only write the var
   while playing and land on 0 once when it stops, so idle frames don't re-composite
   every backdrop-filter glass panel (the main visual cost). */
const overlay = $("overlay");
let _rockIdle = false;
function updateRock(t) {
  if (state === "playing") {
    // two detuned sines → a gentle, non-repeating sway (~±1°), like a ship at anchor
    const r = Math.sin(t * 0.9) * 0.7 + Math.sin(t * 0.37 + 1.3) * 0.3;
    overlay.style.setProperty("--rock", r.toFixed(4));
    _rockIdle = false;
  } else if (!_rockIdle) {
    overlay.style.setProperty("--rock", "0");
    _rockIdle = true;
  }
}

/* ---------- boot ---------- */
window.addEventListener("resize", () => { _varCache = {}; resizeCanvases(); drawFrame(); });
buildLufsTiles(); resizeCanvases(); syncPlayIcon(); requestAnimationFrame(loop);
</script>
